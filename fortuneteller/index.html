<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://glitch.com/favicon.ico" />
   

    <title>Fortune Teller</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
     <img src="https://i.etsystatic.com/5581993/r/il/ce2a60/1753037773/il_340x270.1753037773_epin.jpg" alt="mind reading gif" height="200" width="200">
    <!-- this is the start of content -->
    <h1>
      Fortune Teller
    </h1>
    <form name="fortuneTeller" id="fortuneTeller" action="fortune.html">
      <label for="namefield">Name:</label>
      <input type="text" id="namefield" name="name" placeholder="your name" required>
      <br>
      <label for="Email">Email (this won't be used)</label>
      <input type="email" id="Email" name="Email" placeholder="example@gmail.com"><br>
      <p>Would you consider yourself fashionable?</p>
      <label for="Yes">Yes</label>
      <input type="radio" id="Yes" name="Yes">
      <label for="No">No</label>
      <input type="radio" id="No" name="No"><br>
      <label for="questionfield">Question:</label>
      <input type="text" id="questionfield" name="question" placeholder="a yes or no question">
      <br>
      <p>Is your favorite color blue?</p>
      <label for="Yes2">Yes</label>
      <input type="radio" id="Yes2" name="Yes2">
      <label for="No2">No (I hate fun and will never find peace)</label>
      <input type="radio" id="No2" name="No2">
      <br>
      <label for="Username">What is your IG handle</label>
      <input type="text" id="Username" name="Username">
      <br>
       <p>Were you born before or after Obama's first term?</p>
        <select name="Obama">
            <option value="Before">Before</option>
            <option value="During">During</option>
            <option value="After">After</option>
        </select><br>
      <p>Do you want us to email you in the future about meaningless advertisements?</p>
       <label for="Yes3">Yes</label>
      <input type="radio" id="Yes3" name="Yes3">
      <label for="No2">No, I respect myself enough</label>
      <input type="radio" id="No3" name="No3">
      <br>
        <input type="submit">
        <input type="reset">
    </form>
    <div id="fortune"></div>
  </body>
</html>
